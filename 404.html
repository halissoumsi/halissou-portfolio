<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
    <title>404 — Page introuvable | Mouhamadou Halissou</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="icon" type="image/webp" href="images/halissou.webp">
    <link rel="icon" type="image/png" sizes="192x192" href="images/halissou.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0b0e14;
            --bg-card: #121722;
            --text-primary: #f4f5f7;
            --text-secondary: #b8c1cf;
            --text-muted: #8b97ab;
            --primary-color: #4f86f7;
            --primary-dark: #2563eb;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-primary: #f7f5f0;
            --bg-card: #ffffff;
            --text-primary: #111622;
            --text-secondary: #3b4559;
            --text-muted: #525f75;
            --primary-color: #1d4ed8;
            --primary-dark: #1e40af;
            --border-color: rgba(17, 22, 34, 0.12);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 540px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 3rem 2.5rem;
            text-align: left;
        }

        .eyebrow {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-bottom: 1rem;
            display: inline-block;
        }

        .error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(4.5rem, 14vw, 6.5rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 1.25rem;
        }

        .divider {
            width: 48px;
            height: 2px;
            background: var(--primary-color);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        p {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 1.6rem;
            background: var(--primary-dark);
            color: #ffffff;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: var(--primary-color);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            main { padding: 2.25rem 1.5rem; }
            h1 { font-size: 1.45rem; }
        }
    </style>
</head>
<body>
    <main>
        <span class="eyebrow" data-translate="eyebrow">Erreur 404</span>
        <div class="error-code" aria-hidden="true">404</div>
        <div class="divider" aria-hidden="true"></div>
        <h1 data-translate="title">Page introuvable</h1>
        <p data-translate="description">La page demandée n'existe pas ou a été déplacée. Vous pouvez revenir directement à l'accueil du portfolio.</p>
        <a href="index.html" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            <span data-translate="btn">Retour à l'accueil</span>
        </a>
    </main>
    <script src="404.js" defer></script>
</body>
</html>
